<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:system-ui, sans-serif;
        }
        body{
            background:#f7f8fa;
            color:#222;
            line-height:1.6;
        }
        nav{
            background:#2c3e50;
            padding:1rem;
            position:sticky;
            top:0;
        }
        nav ul{
            list-style:none;
            display:flex;
            gap:2rem;
            justify-content:center;
        }
        nav a{
            color:white;
            text-decoration:none;
            font-size:1.05rem;
        }
        nav a:hover{
            color:#3498db;
        }
        .container{
            max-width:1000px;
            margin:0 auto;
            padding:3rem 2rem;
        }
        section{
            margin-bottom:5rem;
        }
        h2{
            color:#2c3e50;
            margin-bottom:1.5rem;
            border-left:4px solid #3498db;
            padding-left:12px;
        }
        .photo-group{
            display:flex;
            flex-wrap:wrap;
            gap:20px;
            justify-content:center;
        }
        .photo-group img{
            width:280px;
            height:360px;
            object-fit:cover;
            border-radius:8px;
            box-shadow:0 2px 10px #00000020;
        }
        .download-btn{
            display:inline-block;
            background:#3498db;
            color:white;
            padding:12px 24px;
            border-radius:6px;
            text-decoration:none;
            margin-top:1rem;
        }
        .download-btn:hover{
            background:#2980b9;
        }
        .intro-text{
            font-size:1.1rem;
            margin-bottom:2rem;
        }
    </style>
</head>
<body>
    <!--导航栏-->
    <nav>
        <ul>
            <li><a href="#home">首页</a></li>
            <li><a href="#about">关于我</a></li>
            <li><a href="#photos">个人照片</a></li>
            <li><a href="#resume">简历下载</a></li>
        </ul>
    </nav>

    <div class="container">
        <!--首页板块-->
        <section id="home">
            <h2>首页</h2>
            <p class="intro-text">欢迎来到我的个人主页！</p>
        </section>

        <!--关于我板块-->
        <section id="about">
            <h2>关于我</h2>
            <p>我是肖兴宇，湖南大学在读学生，曾担任校民族乐团团长，具备良好的沟通协调与组织管理能力，擅长文案撰写、活动策划，熟练掌握中英文读写，希望在实践中持续学习成长。</p>
        </section>

        <!--照片板块（3张图片）-->
        <section id="photos">
            <h2>个人照片</h2>
            <div class="photo-group">
                <img src="mmexport1753255351972.jpg" alt="照片1">
                <img src="mmexport1790232477632.jpg" alt="照片2">
                <img src="mmexport1790232480204.jpg" alt="照片3">
            </div>
        </section>

        <!--简历PDF下载板块-->
        <section id="resume">
            <h2>简历下载</h2>
            <p>点击下方按钮获取完整PDF简历</p>
            <a class="download-btn" href="cv.pdf" download>下载简历PDF</a>
        </section>
    </div>
</body>
</html>
